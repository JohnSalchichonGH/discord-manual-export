name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  safety:
    name: Safety guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No dependencies to install; the guard uses only Node built-ins.
      - run: npm test
